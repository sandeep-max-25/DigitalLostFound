
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Lost & Found | Notice Board</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --navy: #14213d;
    --blue: #2563eb;
    --teal: #0d9488;
    --bg: #f4f7fb;
    --muted: #64748b;
}

body {
    margin: 0;
    background: var(--bg);
    color: #1e293b;
}

header {
    background: linear-gradient(120deg, #14213d, #1d4ed8);
    color: white;
    padding: 30px 20px;
}

.header-inner {
    max-width: 1150px;
    margin: auto;
}

header h1 {
    margin: 0 0 9px;
    font-size: 29px;
}

header p {
    margin: 0;
    color: #dbeafe;
}

.container {
    max-width: 1150px;
    margin: 28px auto;
    padding: 0 20px;
}

.section-title {
    margin: 0 0 17px;
    color: var(--navy);
    font-size: 21px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.stat-card, .panel {
    background: white;
    border-radius: 14px;
    padding: 21px;
    box-shadow: 0 5px 20px #0f172a0b;
}

.stat-card {
    border: 1px solid #e8edf5;
    transition: transform .2s, box-shadow .2s;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px #0f172a14;
}

.stat-card p {
    color: var(--muted);
    margin: 0 0 10px;
    font-size: 14px;
}

.stat-card h2 {
    margin: 0;
    font-size: 30px;
    color: var(--navy);
}

.stat-icon {
    font-size: 23px;
    margin-bottom: 10px;
}

.content-grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 22px;
    align-items: start;
}

.panel h2 {
    margin: 0 0 20px;
    color: var(--navy);
    font-size: 20px;
}

label {
    display: block;
    margin: 13px 0 7px;
    font-size: 14px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #dbe3ef;
    border-radius: 8px;
    background: white;
    font-size: 14px;
    outline: none;
    transition: border .2s, box-shadow .2s;
}

input:focus, select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px #2563eb18;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 17px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: transform .2s, background .2s;
}

button:hover {
    transform: translateY(-2px);
}

.primary-btn {
    width: 100%;
    margin-top: 18px;
    background: var(--blue);
    color: white;
}

.primary-btn:hover {
    background: #1d4ed8;
}

.toolbar {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 10px;
    margin-bottom: 18px;
}

.item-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.item-card {
    background: #fff;
    border: 1px solid #e5eaf2;
    border-radius: 12px;
    padding: 18px;
    animation: appear .35s ease both;
    transition: transform .2s, box-shadow .2s;
}

.item-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px #0f172a12;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.item-card h3 {
    margin: 13px 0;
    font-size: 18px;
    color: var(--navy);
    overflow-wrap: anywhere;
}

.item-card p {
    margin: 9px 0;
    color: #475569;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.type-badge, .status-badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.lost {
    background: #fee2e2;
    color: #b91c1c;
}

.found {
    background: #ccfbf1;
    color: #0f766e;
}

.returned {
    background: #dcfce7;
    color: #15803d;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.item-meta {
    border-top: 1px solid #edf0f5;
    margin-top: 13px;
    padding-top: 8px;
}

.return-btn {
    margin-top: 12px;
    background: #0d9488;
    color: white;
}

.return-btn:hover {
    background: #0f766e;
}

.message {
    font-size: 13px;
    margin-top: 12px;
    line-height: 1.5;
}

.empty {
    grid-column: 1 / -1;
    padding: 35px 15px;
    text-align: center;
    color: var(--muted);
    background: #f8fafc;
    border-radius: 10px;
}

footer {
    text-align: center;
    padding: 25px;
    color: var(--muted);
    font-size: 13px;
}

@media(max-width: 850px) {
    .content-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 550px) {
    header h1 { font-size: 23px; }
    .item-list { grid-template-columns: 1fr; }
    .toolbar { grid-template-columns: 1fr; }
    .container { padding: 0 13px; }
    .stats { gap: 10px; }
    .stat-card { padding: 15px; }
    .stat-card h2 { font-size: 25px; }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>🔎 Digital Lost & Found</h1>
        <p>Lost something? Found something? Let's reunite it with its owner.</p>
    </div>
</header>

<main class="container">

    <h2 class="section-title">Dashboard Overview</h2>

    <section class="stats">
        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <p>Total Notices</p>
            <h2 id="totalCount">0</h2>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🔍</div>
            <p>Lost Items</p>
            <h2 id="lostCount">0</h2>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📦</div>
            <p>Found Items</p>
            <h2 id="foundCount">0</h2>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🤝</div>
            <p>Returned Items</p>
            <h2 id="returnedCount">0</h2>
        </div>
    </section>

    <section class="content-grid">

        <div class="panel">
            <h2>➕ Add a Notice</h2>

            <form id="itemForm">
                <label for="name">Item Name</label>
                <input id="name" type="text"
                       placeholder="Example: Black wallet" required>

                <label for="type">Notice Type</label>
                <select id="type" required>
                    <option value="LOST">Lost Item</option>
                    <option value="FOUND">Found Item</option>
                </select>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Electronics</option>
                    <option>Personal Items</option>
                    <option>Books</option>
                    <option>Documents</option>
                    <option>Other</option>
                </select>

                <label for="location">Location</label>
                <input id="location" type="text"
                       placeholder="Where was it lost or found?" required>

                <label for="contact">Contact Number</label>
                <input id="contact" type="tel"
                       placeholder="Enter contact number" required>

                <button class="primary-btn" type="submit">
                    Add Notice
                </button>

                <p id="message" class="message" role="status"></p>
            </form>
        </div>

        <div class="panel">
            <h2>📌 Notice Board</h2>

            <div class="toolbar">
                <input id="search" type="search"
                       placeholder="Search item name...">

                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option>Electronics</option>
                    <option>Personal Items</option>
                    <option>Books</option>
                    <option>Documents</option>
                    <option>Other</option>
                </select>
            </div>

            <div id="itemList" class="item-list">
                <div class="empty">Loading notices...</div>
            </div>
        </div>

    </section>
</main>

<footer>
    Digital Lost-and-Found Notice Board | Java + Maven
</footer>

<script>
const itemForm = document.getElementById("itemForm");
const itemList = document.getElementById("itemList");
const message = document.getElementById("message");
const search = document.getElementById("search");
const categoryFilter = document.getElementById("categoryFilter");

let allItems = [];

function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function updateDashboard(items) {
    document.getElementById("totalCount").textContent = items.length;
    document.getElementById("lostCount").textContent =
        items.filter(item => item.type === "LOST").length;
    document.getElementById("foundCount").textContent =
        items.filter(item => item.type === "FOUND").length;
    document.getElementById("returnedCount").textContent =
        items.filter(item => item.returned).length;
}

function displayItems(items) {
    itemList.innerHTML = "";

    if (items.length === 0) {
        itemList.innerHTML =
            '<div class="empty">No matching notices found.</div>';
        return;
    }

    items.forEach(item => {
        const card = document.createElement("article");
        card.className = "item-card";

        const typeClass = item.type === "LOST" ? "lost" : "found";

        card.innerHTML = `
            <span class="type-badge ${typeClass}">
                ${safe(item.type)}
            </span>

            <h3>${safe(item.name)}</h3>

            <div class="item-meta">
                <p>📂 <strong>Category:</strong> ${safe(item.category)}</p>
                <p>📍 <strong>Location:</strong> ${safe(item.location)}</p>
                <p>📞 <strong>Contact:</strong> ${safe(item.contact)}</p>
                <p>🆔 <strong>Notice ID:</strong> ${safe(item.id)}</p>
            </div>

            <p>
                <span class="status-badge ${item.returned ? "returned" : "pending"}">
                    ${item.returned ? "✓ Item Returned" : "● Awaiting Return"}
                </span>
            </p>

            ${item.returned ? "" :
                '<button class="return-btn">Mark as Returned</button>'}
        `;

        const returnButton = card.querySelector(".return-btn");

        if (returnButton) {
            returnButton.addEventListener("click", () => markReturned(item.id));
        }

        itemList.appendChild(card);
    });
}

function applyFilters() {
    const query = search.value.trim().toLowerCase();
    const category = categoryFilter.value;

    const filtered = allItems.filter(item => {
        const matchesName = String(item.name || "")
            .toLowerCase().includes(query);

        const matchesCategory = !category || item.category === category;

        return matchesName && matchesCategory;
    });

    displayItems(filtered);
}

async function loadItems() {
    try {
        const response = await fetch("/api/items");

        if (!response.ok) throw new Error("Could not load notices");

        allItems = await response.json();
        updateDashboard(allItems);
        applyFilters();

    } catch (error) {
        itemList.innerHTML =
            '<div class="empty">Unable to load notices. Please refresh the page.</div>';
    }
}

itemForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.style.color = "#64748b";
    message.textContent = "Adding notice...";

    const data = new URLSearchParams();
    data.append("name", document.getElementById("name").value.trim());
    data.append("type", document.getElementById("type").value);
    data.append("category", document.getElementById("category").value);
    data.append("location", document.getElementById("location").value.trim());
    data.append("contact", document.getElementById("contact").value.trim());

    try {
        const response = await fetch("/api/items", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Could not add notice");
        }

        message.style.color = "#15803d";
        message.textContent = result.message || "Notice added successfully!";

        itemForm.reset();
        search.value = "";
        categoryFilter.value = "";

        await loadItems();

    } catch (error) {
        message.style.color = "#dc2626";
        message.textContent = error.message;
    }
});

search.addEventListener("input", applyFilters);
categoryFilter.addEventListener("change", applyFilters);

async function markReturned(id) {
    if (!confirm("Are you sure this item has been returned?")) return;

    try {
        const response = await fetch("/api/return?id=" + encodeURIComponent(id));
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Update failed");
        }

        await loadItems();

    } catch (error) {
        alert(error.message);
    }
}

loadItems();
</script>

</body>
</html>
